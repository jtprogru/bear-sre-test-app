name: Go

on:
  push:
    # Ветки task/* — стартовые состояния полигона. Они намеренно не проходят
    # гейт: gosec справедливо ругается на отсутствующий ReadHeaderTimeout
    # (G112) и на os.Open с переменным путём (G304), а это ровно то, что
    # кандидату предстоит починить. Красный прогон на них не несёт информации
    # и только заглушает настоящие письма о падениях.
    #
    # Работа кандидата проверяется триггером pull_request ниже.
    branches-ignore:
      - "task/**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 1.26 — директива go.mod и джобы lint и conformance, нижняя граница.
        # 1.27 — тулчейн билдера в Dockerfile.
        go-version: ["1.26", "1.27"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          # Без check-latest setup-go берёт патч-версию из кэша раннера, а она
          # отстаёт от релизов Go. govulncheck ниже тогда падает на уязвимостях
          # stdlib, уже закрытых в свежем патче.
          check-latest: true

      - name: Build
        run: go build -v -o bin/app ./cmd/app

      - name: Vet
        run: go vet ./...

      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Релиз gosec v2.29.0 зависит от golang.org/x/tools v0.49.0, а тот не
      # читает export data от Go 1.27.2: «export data version 5 is greater than
      # maximum supported version 4». Поэтому gosec собирается во временном
      # модуле со свежим x/tools. Когда у gosec выйдет релиз с обновлённым
      # x/tools, шаг можно вернуть к go install ...@latest.
      - name: Static security scan (gosec)
        run: |
          mkdir "$RUNNER_TEMP/gosec-build"
          cd "$RUNNER_TEMP/gosec-build"
          go mod init gosec-build
          go get github.com/securego/gosec/v2/cmd/gosec@latest golang.org/x/tools@latest
          go install github.com/securego/gosec/v2/cmd/gosec
          cd "$GITHUB_WORKSPACE"
          gosec ./...

      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Show coverage
        run: go tool cover -func=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.go-version }}
          path: coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      # Линтеры ставятся напрямую, а не сторонними actions: одной зависимостью
      # с правом на исполнение в CI меньше.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run --timeout 5m

      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:latest-alpine < Dockerfile

  conformance:
    # Чёрный ящик поверх собранного контейнера: проверяет HTTP-контракт,
    # graceful shutdown и отсутствие утечки дескрипторов.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Build binary under test
        run: go build -o dist/bear-sre-test-app ./cmd/app

      - name: Run conformance suite
        run: go test -v -tags conformance -count=1 ./conformance/...
        env:
          CONFORMANCE_BINARY: ./dist/bear-sre-test-app
