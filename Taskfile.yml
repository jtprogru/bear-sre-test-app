# yaml-language-server: $schema=https://taskfile.dev/schema.json
---
version: "3"

set:
  - pipefail

vars:
  BINARY_DIR: dist
  BINARY_NAME: bear-sre-test-app
  DOCKER_REPO: ghcr.io/jtprogru/bear-sre-test-app
  BASE_URL: http://127.0.0.1:8080

# Makefile раньше делал `include .env` без дефиса: без файла падала любая цель,
# включая help. Здесь .env подхватывается опционально.
dotenv: [".env"]

tasks:
  default:
    cmd: task --list

  run:
    desc: Запустить через go run
    cmd: go run ./cmd/app -debug

  run:bin:
    desc: Собрать и запустить бинарь
    deps: [build]
    cmd: ./{{.BINARY_DIR}}/{{.BINARY_NAME}} -debug

  build:
    desc: Собрать бинарь
    cmd: CGO_ENABLED=0 go build -ldflags="-w -s" -o ./{{.BINARY_DIR}}/{{.BINARY_NAME}} ./cmd/app
    generates:
      - "{{.BINARY_DIR}}/{{.BINARY_NAME}}"

  build:docker:
    desc: Собрать docker-образ
    cmd: docker build -t {{.DOCKER_REPO}}:local .

  up:
    desc: Поднять через docker compose
    deps: [testdata]
    cmd: docker compose up -d --build

  down:
    desc: Погасить docker compose
    cmd: docker compose down -v

  testdata:
    desc: Создать секретный файл для /secret
    cmd: mkdir -p testdata && dd if=/dev/urandom of=testdata/jtprogru.test bs=1024 count=4 status=none
    status:
      - test -s testdata/jtprogru.test

  test:
    desc: Прогнать unit-тесты под race detector
    cmd: go test -race -coverprofile=cover.out ./...

  test:coverage:
    desc: Показать покрытие
    deps: [test]
    cmd: go tool cover -func=cover.out

  test:conformance:
    desc: Прогнать conformance-набор против собранного бинаря
    deps: [build]
    cmd: go test -v -tags conformance -count=1 ./conformance/...
    env:
      CONFORMANCE_BINARY: "./{{.BINARY_DIR}}/{{.BINARY_NAME}}"

  lint:
    desc: Запустить golangci-lint
    cmd: golangci-lint run --timeout 5m

  lint:docker:
    desc: Запустить hadolint
    cmd: hadolint Dockerfile

  sec:
    desc: gosec + govulncheck
    cmds:
      - gosec -quiet ./...
      - govulncheck ./...

  fmt:
    desc: Отформатировать код
    cmd: gofmt -s -w .

  vet:
    desc: go vet
    cmd: go vet ./...

  tidy:
    desc: go mod tidy
    cmd: go mod tidy

  check:
    desc: Полная проверка — то же, что гоняет CI
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: sec
      - task: test:coverage
      - task: lint:docker

  load:
    desc: Нагрузочный прогон k6 (сервис должен быть уже запущен)
    cmd: k6 run k6/load.js
    env:
      BASE_URL: "{{.BASE_URL}}"

  clean:
    desc: Убрать артефакты сборки
    cmd: rm -rf {{.BINARY_DIR}} cover.out
