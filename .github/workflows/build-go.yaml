name: Go

on:
  push:
    # Ветка task/* — стартовое состояние полигона. Она намеренно не проходит
    # гейт: gosec справедливо ругается на отсутствующий ReadHeaderTimeout
    # (G112) и на os.Open с переменным путём (G304), а это ровно то, что
    # предстоит починить. Красный прогон здесь не несёт информации.
    #
    # Оформите работу как pull request — тогда полный гейт отработает.
    branches-ignore:
      - "task/**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build -v -o bin/app ./cmd/app

      - name: Vet
        run: go vet ./...

      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Static security scan (gosec)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...

      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Show coverage
        run: go tool cover -func=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.go-version }}
          path: coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      # Линтеры ставятся напрямую, а не сторонними actions: одной зависимостью
      # с правом на исполнение в CI меньше.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run --timeout 5m

      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:latest-alpine < Dockerfile
